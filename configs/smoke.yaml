# Offline smoke-test config: no network, no API key, no GPU.
# Validates that every script runs end-to-end. Numbers produced with it are NOT
# research results (hashing embeddings, mock LLM, tiny randomly-initialized model).
extends: config.yaml

paths:
  processed_dir: data/processed_smoke
  results_dir: results/smoke
  chroma_dir: data/processed_smoke/chroma
  cache_db: data/processed_smoke/llm_cache.sqlite

data:
  synthetic_policies: {n_docs: 240}
  hard_negatives: {n_docs: 120}

embeddings:
  model_name: hashing

llm:
  provider: mock
  use_cache: false

layer1:
  base_model: models/tiny-distilbert       # built by scripts/make_tiny_model.py
  output_dir: models/layer1_smoke
  max_length: 192
  epochs: 3
  lr: 1.0e-3
  train_batch_size: 32
  target_fpr: 0.05

layer2:
  slm_fallback: {enabled: false}

eval:
  n_attack_queries: 40
  n_benign_queries: 40

# =============================================================================
# Hybrid IPI Defense — central configuration
# Every script reads this file (override path with --config or IPI_CONFIG env).
# Secrets (API keys) live in .env, never here.
# =============================================================================

seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  external_dir: data/external          # drop local CSV/JSONL datasets here
  models_dir: models
  results_dir: results
  chroma_dir: data/processed/chroma
  cache_db: data/processed/llm_cache.sqlite

# -----------------------------------------------------------------------------
# Datasets
# -----------------------------------------------------------------------------
data:
  # BIPIA is distributed on GitHub (microsoft/BIPIA), not as a HF dataset.
  bipia:
    enabled: true
    base_url: https://raw.githubusercontent.com/microsoft/BIPIA/main/benchmark
    text_attack_files: [text_attack_train.json, text_attack_test.json]
    email_files: [email/train.jsonl, email/test.jsonl]

  # Benign RAG corpus with gold QA (used for utility + clean chunks).
  squad:
    enabled: true
    hf_id: rajpurkar/squad
    split: validation
    max_docs: 600
    min_chars: 300
    max_chars: 1000          # <= chunking.chunk_size so 1 doc == 1 chunk (exact labels)

  # Synthetic enterprise policy documents with gold QA pairs (fully offline).
  synthetic_policies:
    enabled: true
    n_docs: 400

  # Benign "hard negatives": procedural/how-to text full of benign imperatives.
  hard_negatives:
    enabled: true
    n_docs: 400

  # Generic adapters for extra injection corpora (InjectBench, RAG-PIBench, ...).
  # Each entry is loaded from HF (`hf_id`) OR a local file (`local_path`,
  # .csv/.jsonl/.json/.parquet) and mapped onto the standard schema.
  # `role: payload` -> rows with label==1 are used as injection payloads that we
  #                    embed into benign docs; label==0 rows become benign text.
  # `role: chunk`   -> rows are already full chunks with labels; used as-is.
  extra_sources:
    - name: deepset_prompt_injections
      enabled: true
      hf_id: deepset/prompt-injections
      split: train
      text_col: text
      label_col: label
      role: payload
    - name: injectbench
      enabled: false                    # set true once you have the data
      hf_id: null                       # e.g. "<org>/<InjectBench>" if it exists on HF
      local_path: data/external/injectbench.csv
      split: train
      text_col: text
      label_col: label
      role: chunk
    - name: rag_pibench
      enabled: false
      hf_id: null
      local_path: data/external/rag_pibench.jsonl
      split: train
      text_col: text
      label_col: label
      role: chunk

  # Fraction of benign documents that receive a payload.
  poison_rate: 0.5
  positions: [start, middle, end]
  # Payload families held out of training entirely (tests generalization).
  heldout_families: [multilingual, subtle_authority]
  val_frac: 0.1
  test_frac: 0.2

# -----------------------------------------------------------------------------
# RAG
# -----------------------------------------------------------------------------
chunking:
  chunk_size: 1000
  chunk_overlap: 0

embeddings:
  # "hashing" is an OFFLINE smoke-test embedder (no downloads). Never report
  # research numbers with it.
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 64

vector_store:
  backend: chroma          # chroma | faiss
  collection: ipi_eval
  top_k: 4

llm:
  provider: openai         # openai | ollama | mock (mock = offline test double)
  openai_model: gpt-4o-mini
  ollama_model: llama3.1:8b
  ollama_base_url: http://localhost:11434/v1
  temperature: 0.0
  max_tokens: 256
  timeout_s: 60
  use_cache: true
  # USD per 1M tokens. VERIFY against https://openai.com/api/pricing before reporting.
  pricing:
    gpt-4o-mini: {input: 0.15, output: 0.60}
    default: {input: 0.0, output: 0.0}

# -----------------------------------------------------------------------------
# Layer 1 — SLM anomaly detector
# -----------------------------------------------------------------------------
layer1:
  base_model: distilbert-base-uncased
  output_dir: models/layer1_distilbert
  max_length: 384          # covers a full 1000-char chunk + payload (~300 tokens)
  stride: 64               # sliding-window overlap for chunks longer than max_length
  epochs: 3
  lr: 3.0e-5
  train_batch_size: 32
  eval_batch_size: 64
  weight_decay: 0.01
  warmup_ratio: 0.06
  threshold: 0.5           # tuned on val by train_layer1.py (written to threshold.json)
  target_fpr: 0.01         # threshold tuning target on the validation set
  device: auto             # auto | cpu | cuda

layer1_qlora:
  base_model: meta-llama/Meta-Llama-3-8B   # gated: accept licence on HF first
  output_dir: models/layer1_llama3_qlora
  max_length: 256
  epochs: 1
  lr: 2.0e-4
  train_batch_size: 4
  grad_accum: 8
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_train_samples: 6000  # keeps a T4 run under ~2h

# -----------------------------------------------------------------------------
# Layer 2 — contextual quarantine
# -----------------------------------------------------------------------------
layer2:
  mode: strip              # strip | describe
  spacy_model: en_core_web_sm
  sentence_threshold: 3.0  # rule score needed to neutralize a sentence
  detector_sentence_threshold: 0.8
  use_detector_localization: true
  slm_fallback:
    enabled: true
    backend: t5            # t5 | ollama
    t5_model: google/flan-t5-small
    ollama_model: qwen2.5:0.5b
    max_new_tokens: 128
  recheck_with_layer1: true

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
eval:
  n_attack_queries: 150
  n_benign_queries: 150
  use_llm_judge_for_asr: false   # judge success for payloads without a canary
  setups: [undefended, delimiter, llm_judge, hybrid]
